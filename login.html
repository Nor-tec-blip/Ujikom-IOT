<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Login | Monitoring IoT</title>

    <link rel="stylesheet" href="css/login.css" />

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    />
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-header">

                <div class="logo">
                    🌱
                </div>

                <h1>Smart IoT Login</h1>

                <p>
                    Masuk untuk mengakses dashboard monitoring
                </p>

            </div>

            <!-- FORM LOGIN -->
            <form id="loginForm">

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="nama@email.com"
                        required
                    />

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <div style="position:relative;">

                        <input
                            type="password"
                            id="password"
                            placeholder="Masukkan password"
                            required
                        />

                        <button
                            type="button"
                            id="togglePassword"
                            style="
                                position:absolute;
                                right:12px;
                                top:50%;
                                transform:translateY(-50%);
                                background:none;
                                border:none;
                                cursor:pointer;
                                color:white;
                                font-size:18px;
                            "
                        >
                            👁️
                        </button>

                    </div>

                </div>

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

                <p
                    id="loginMessage"
                    class="error-message"
                ></p>

            </form>

        </div>

    </div>

    <script>
        const togglePassword =
            document.getElementById(
                "togglePassword"
            );

        const password =
            document.getElementById(
                "password"
            );

        togglePassword.addEventListener(
            "click",
              () => {

                if (
                    password.type ===
                    "password"
                ) {

                    password.type =
                        "text";

                } else {

                    password.type =
                        "password";
                }
            }
        );
    </script>

    <!-- AUTH -->
    <script
        type="module"
        src="js/auth.js"
    ></script>

</body>
</html>
