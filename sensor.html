<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sensor Settings</title>

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >
</head>

<body>

<div class="dashboard-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo-section">
            <h2>🌱 Smart IoT</h2>
            <p>Monitoring System</p>
        </div>

        <nav class="menu">
            <a href="dashboard.html">
                📊 Dashboard
            </a>

            <a
                href="sensor.html"
                class="active"
            >
                🌡 Sensor
            </a>

            <a href="#">
                ⚡ Relay
            </a>

            <a href="index.html">
                🏠 Home
            </a>
        </nav>

    </aside>

    <!-- MAIN -->
    <main class="main-content">

        <div class="top-header">
            <div>
                <h1>Sensor Settings</h1>
                <p>
                    Pilih sensor yang ingin digunakan
                </p>
            </div>
        </div>

        <div class="chart-card">

            <h2 style="margin-bottom:25px;">
                🔧 Custom Sensor
            </h2>

            <div class="sensor-options">

                <label>
                    <input
                        type="checkbox"
                        value="temperature"
                    >
                    🌡 Temperature
                </label>

                <label>
                    <input
                        type="checkbox"
                        value="humidity"
                    >
                    💧 Humidity
                </label>

                <label>
                    <input
                        type="checkbox"
                        value="soil"
                    >
                    🌱 Soil Moisture
                </label>

                <label>
                    <input
                        type="checkbox"
                        value="light"
                    >
                    ☀ Light Sensor
                </label>

                <label>
                    <input
                        type="checkbox"
                        value="water"
                    >
                    🚿 Water Level
                </label>

                <label>
                    <input
                        type="checkbox"
                        value="ph"
                    >
                    🧪 PH Sensor
                </label>

            </div>

            <button
                id="saveSensors"
                class="login-btn"
                style="margin-top:25px;"
            >
                Simpan Sensor
            </button>

        </div>

    </main>

</div>

<script>
const saveBtn =
document.getElementById(
"saveSensors"
);

saveBtn.addEventListener(
"click",
() => {

const selected =
[
...document.querySelectorAll(
'input[type="checkbox"]:checked'
)
].map(
cb => cb.value
);

localStorage.setItem(
"sensors",
JSON.stringify(selected)
);

alert(
"Sensor berhasil disimpan!"
);
});
</script>

</body>
</html>
