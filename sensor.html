<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Custom Sensor</title>

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

    <style>

        body{
            background:#0b1120;
            color:white;
            font-family:Poppins,sans-serif;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:50px auto;
        }

        .card{
            background:rgba(255,255,255,.05);
            border-radius:25px;
            padding:30px;
            border:1px solid rgba(255,255,255,.1);
        }

        h1{
            margin-bottom:10px;
        }

        p{
            color:#94a3b8;
            margin-bottom:30px;
        }

        .sensor-list{
            display:grid;
            grid-template-columns:
            repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
        }

        .sensor-item{
            background:
            rgba(255,255,255,.05);

            border:
            1px solid rgba(255,255,255,.08);

            border-radius:20px;

            padding:20px;
        }

        .sensor-item label{
            cursor:pointer;
            display:flex;
            gap:10px;
            align-items:center;
        }

        input[type="checkbox"]{
            transform:scale(1.3);
        }

        .save-btn{
            margin-top:30px;
            border:none;
            padding:16px 28px;
            border-radius:18px;
            background:#38bdf8;
            color:white;
            cursor:pointer;
            font-size:16px;
            font-weight:600;
        }

    </style>
</head>
<body>

<div class="container">

    <div class="card">

        <h1>
            🌡 Custom Sensor
        </h1>

        <p>
            Pilih sensor yang ingin digunakan
            pada dashboard monitoring.
        </p>

        <div class="sensor-list">

            <div class="sensor-item">
                <label>
                    <input
                        type="checkbox"
                        value="temperature"
                    >
                    🌡 Temperature
                </label>
            </div>

            <div class="sensor-item">
                <label>
                    <input
                        type="checkbox"
                        value="humidity"
                    >
                    💧 Humidity
                </label>
            </div>

            <div class="sensor-item">
                <label>
                    <input
                        type="checkbox"
                        value="soil"
                    >
                    🌱 Soil Moisture
                </label>
            </div>

            <div class="sensor-item">
                <label>
                    <input
                        type="checkbox"
                        value="light"
                    >
                    ☀ Light Sensor
                </label>
            </div>

            <div class="sensor-item">
                <label>
                    <input
                        type="checkbox"
                        value="water"
                    >
                    🚿 Water Level
                </label>
            </div>

            <div class="sensor-item">
                <label>
                    <input
                        type="checkbox"
                        value="ph"
                    >
                    🧪 pH Sensor
                </label>
            </div>

        </div>

        <button
            class="save-btn"
            onclick="saveSensors()"
        >
            Simpan Sensor
        </button>

    </div>

</div>

<script>

function saveSensors(){

    const selected =
    [...document.querySelectorAll(
    'input[type="checkbox"]:checked'
    )].map(cb=>cb.value);

    localStorage.setItem(
        "selectedSensors",
        JSON.stringify(selected)
    );

    alert(
        "Sensor berhasil disimpan!"
    );

    window.location.href =
    "dashboard.html";
}

</script>

</body>
</html>
